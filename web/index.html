<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="אוטוסקופ — בדיקת רכב יד שנייה לפי מספר רישוי: סטטוס, טסט, ריקולים, היסטוריית בעלויות, הערכת שווי ומפרט מלא מתוך מאגרי data.gov.il."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <title>אוטוסקופ — בדיקת רכב יד שנייה לפי מספר רישוי</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="./node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("autoscope.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <footer>
        <a href="https://motomarks.io">לוגואים מסופקים על ידי Motomarks</a>
      </footer>      
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
